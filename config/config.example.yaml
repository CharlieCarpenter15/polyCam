# Example configuration for the meeting-room appliance.
#
# GENERATED FILE — do not edit. Run scripts/gen-config-docs.py to refresh.
#
# You do not normally need this file: scripts/install.sh writes a real
# config/config.yaml for you, and everything in it can be changed from the
# Settings page in a browser. It is here so you can see every option and
# its default in one place.
#
# To use it as a starting point:
#     cp config/config.example.yaml config/config.yaml
#     chmod 600 config/config.yaml
# ----------------------------------------------------------------------
# Room
#   What the room is called on screen.
# ----------------------------------------------------------------------
# Shown in large type at the top of the dashboard.
ROOM_NAME: Meeting Room

# Optional second line, e.g. a floor or capacity: “Level 3 · 8 seats”.
ROOM_SUBTITLE: ''

# IANA time zone name. Leave empty to use the Raspberry Pi's own time
# zone.
TIMEZONE: ''

# Off shows 10:42 AM, on shows 10:42.
TIME_FORMAT_24H: false

# ----------------------------------------------------------------------
# Calendar
#   Where the room's meetings come from. An ICS/iCal feed is the
#   quickest way to get going; Microsoft Graph and Google Calendar can
#   be dropped in later without touching the rest of the appliance.
# ----------------------------------------------------------------------
# “ics” uses the ICS/iCal URL below. “mock” invents meetings so you can
# test the screen without a real calendar. “none” disables the calendar
# entirely.
# options: ics, mock, none
CALENDAR_SOURCE: ics

# The room calendar's secret iCal address. Outlook: Calendar → Share →
# Publish a calendar → ICS link. Google: Calendar settings → Secret
# address in iCal format. A local file path also works.
CALENDAR_ICS_URL: ''

# How often the calendar is re-fetched. 30 seconds is a good default.
CALENDAR_REFRESH_SECONDS: 30

# How far into the future meetings are loaded.
CALENDAR_LOOKAHEAD_HOURS: 24

# How many meetings are listed under “Upcoming” (3–5 fits a TV nicely).
CALENDAR_UPCOMING_COUNT: 4

CALENDAR_TIMEOUT_SECONDS: 20

# Turn off for privacy: the dashboard then shows “Busy” instead of the
# subject.
CALENDAR_SHOW_TITLES: true

# All-day entries (out-of-office, holidays) do not mark the room busy.
CALENDAR_IGNORE_ALL_DAY: true

# Skip events the organiser has cancelled.
CALENDAR_IGNORE_DECLINED: true

# ----------------------------------------------------------------------
# Meeting joining
#   How the appliance behaves around meeting start and end times.
# ----------------------------------------------------------------------
# Navigate the TV to the meeting shortly before it starts.
AUTO_OPEN_MEETING: true

# 1 means the meeting page opens about one minute before the start time.
AUTO_OPEN_MINUTES: 1.0

# Best effort. Teams, Meet and Zoom change their web pages without notice,
# so if this fails the big JOIN button on the dashboard always works.
AUTO_CLICK_JOIN: true

# 0 uses a sensible per-provider default (6–8 seconds). Raise it on slower
# hardware: pressing buttons on a page that has not finished drawing
# wastes the whole join attempt. A Raspberry Pi 3 may need 25–40.
JOIN_SETTLE_SECONDS: 0.0

AUTO_JOIN_TIMEOUT_SECONDS: 90

# A slow meeting page can look unchanged for several seconds after Join is
# pressed. Without this guard the room presses it again, and again, which
# looks like the meeting being opened several times over.
JOIN_REPEAT_GUARD_SECONDS: 25.0

# Grace period after a meeting's scheduled end before the TV goes back to
# the room screen.
RETURN_HOME_MINUTES: 2.0

# Safety net: the appliance never stays on a meeting page longer than
# this, even if the calendar goes strange.
MAX_MEETING_MINUTES: 240

# One per line, matched case-insensitively against on-screen button text.
# Update this list if a provider renames a button — no code change needed.
JOIN_BUTTON_TEXTS:
- Continue on this browser
- Use the web app instead
- Continue in this browser
- Join now
- Join meeting
- Join call
- Ask to join
- Join anyway
- Continue without audio or video
- Dismiss

# Name typed into “your name” boxes when the room joins as a guest. Leave
# empty to use the room name.
JOIN_DISPLAY_NAME: ''

# Ask the meeting page to mute the room's microphone on entry.
JOIN_MUTE_ON_ENTRY: false

# ----------------------------------------------------------------------
# AirPlay screen sharing
#   Wireless screen sharing from a Mac, iPhone or iPad.
# ----------------------------------------------------------------------
AIRPLAY_ENABLED: true

# What appears in Screen Mirroring on a Mac or iPhone. Leave empty to use
# the room name.
AIRPLAY_NAME: ''

# Optional numeric PIN a guest must type to share their screen. Empty
# means anyone on the network can share.
AIRPLAY_PIN: ''

# Appended to the uxplay command line for unusual setups.
AIRPLAY_EXTRA_ARGS: ''

# On: mirroring covers the meeting on the TV (the call keeps running).
# Off: mirroring is refused during a meeting. Either way, sharing through
# Teams or Meet is better, because remote participants can see it too.
AIRPLAY_INTERRUPTS_MEETING: true

# ----------------------------------------------------------------------
# Miracast (Windows wireless display)
#   What Windows calls “Connect to a wireless display” (Win+K): the room
#   appears in a list the operating system draws, and nothing is
#   installed or typed on the laptop. The closest thing to AirPlay there
#   is. Off by default because it needs a Wi-Fi radio free for Wi-Fi
#   Direct and receiver software that Raspberry Pi OS does not package —
#   run scripts/detect-miracast.sh, which says whether this room can.
# ----------------------------------------------------------------------
# Lets a Windows laptop mirror with Win+K, picking this room from the list
# Windows draws — nothing installed, nothing typed. Needs a Wi-Fi radio
# free for Wi-Fi Direct and a receiver backend installed. Run
# scripts/detect-miracast.sh before turning this on; it says whether this
# machine can, and what is missing if not.
MIRACAST_ENABLED: false

# What appears in the Windows wireless-display list. Leave empty to use
# the room name.
MIRACAST_NAME: ''

# Optional PIN Windows must be given before it can mirror. Empty means
# anyone in range can. Not supported by every backend.
MIRACAST_PIN: ''

# Which receiver software to drive. “auto” uses whichever is installed.
# Neither is in the Raspberry Pi OS archive, so one has to be built — see
# the README.
# options: auto, miraclecast, lazycast
MIRACAST_BACKEND: auto

# Miracast over Infrastructure: Windows is still found over Wi-Fi Direct,
# but the picture travels over the ordinary network, which is lower
# latency and steadier. Turn off only if a laptop will not connect.
MIRACAST_INFRASTRUCTURE: true

# Leave empty to use the first wireless interface. Name it in a room with
# two adapters, so the one carrying the network is not taken over.
MIRACAST_INTERFACE: ''

# A Miracast receiver needs a radio not associated with any network. Off,
# the receiver refuses to start and says so rather than risk the room's
# connection. On, it disconnects that interface — and only if a wired
# connection is up, so the room cannot be stranded.
MIRACAST_FREE_RADIO: false

# Where lazycast is checked out, if that is the backend.
MIRACAST_LAZYCAST_DIR: /opt/lazycast

# Appended to the backend's command line for unusual setups.
MIRACAST_EXTRA_ARGS: ''

# ----------------------------------------------------------------------
# Screen sharing from a PC (browser)
#   The fallback for when Miracast cannot work: a Windows PC, Chromebook
#   or Linux laptop opens the address shown on the TV, presses one
#   button and picks a window. Nothing to install. The video goes
#   straight from the laptop to the TV over the room's network, so the
#   Pi only introduces the two of them.
# ----------------------------------------------------------------------
# Lets a Windows, Linux or Chromebook laptop share its screen by opening
# the address the TV shows. This opens a second port on the room's
# network, carrying the sharing page and nothing else.
CAST_ENABLED: true

# The port in the address shown on the TV. Kept separate from the
# dashboard port on purpose: this one is always open to the room's network
# and carries only the sharing page, so opening it never exposes the
# settings or the room controller.
CAST_PORT: 8000

# Where the page that actually captures the screen is served. Browsers
# only allow screen capture over an encrypted connection, so the room
# generates its own certificate — which is why a browser warns about it
# once per laptop.
CAST_SECURE_PORT: 8443

# Optional code a laptop must type before it can share. Empty means anyone
# who can reach the room's network can share, which matches how AirPlay
# behaves by default.
CAST_PIN: ''

# “auto” shows it only when Miracast is not working, so a room with Win+K
# sharing keeps a clean screen and one with a problem still tells people
# what to do. “always” also suits rooms with Chromebooks or Linux laptops,
# which have no Miracast.
# options: auto, always, never
CAST_SHOW_ON_TV: auto

# ----------------------------------------------------------------------
# Poly conference bar
#   The USB conference bar used as camera, microphone and speaker.
# ----------------------------------------------------------------------
# Detect the USB bar and make it the default camera, microphone and
# speaker.
POLY_ENABLED: true

# “auto” picks the Poly bar automatically. Otherwise a PipeWire/PulseAudio
# source name — the Diagnostics page lists them.
MICROPHONE_DEVICE: auto

# “auto” picks the Poly bar. Set to “hdmi” to play sound through the TV,
# or paste an exact sink name.
SPEAKER_DEVICE: auto

# “auto” picks the Poly bar, or give a device path such as /dev/video0.
CAMERA_DEVICE: auto

# Case-insensitive words used to recognise the bar in lsusb / PipeWire
# output. One per line. Add your model's name here if detection fails.
POLY_USB_MATCH:
- poly
- plantronics
- polycom
- studio
- hp inc

# Applied to the conference bar when the appliance starts. 0 disables.
POLY_STARTUP_VOLUME: 65

POLY_CHECK_SECONDS: 20

# ----------------------------------------------------------------------
# Poly remote / controller
#   Optional physical remote / controller buttons.
# ----------------------------------------------------------------------
# Turn on if you have a Poly remote or controller. Use Diagnostics →
# Discover remote buttons to find the key names.
POLY_REMOTE_ENABLED: false

# “auto” watches every matching input device. Otherwise an
# /dev/input/eventN path.
POLY_REMOTE_DEVICE: auto

# Joins the current or next meeting.
POLY_ANSWER_KEY: KEY_ENTER

# Leaves the meeting and returns to the dashboard.
POLY_HANGUP_KEY: KEY_ESC

# Toggles the microphone.
POLY_MUTE_KEY: KEY_MUTE

POLY_VOLUME_UP_KEY: KEY_VOLUMEUP

POLY_VOLUME_DOWN_KEY: KEY_VOLUMEDOWN

# Optional. Toggles the camera in the meeting where supported.
POLY_CAMERA_KEY: ''

# Forces the TV back to the room dashboard.
POLY_HOME_KEY: KEY_HOME

POLY_VOLUME_STEP: 5

# ----------------------------------------------------------------------
# Room controller (phone)
#   The big-button page anyone in the room can open by scanning the QR
#   code on the TV. It joins, leaves, mutes and changes the volume — and
#   nothing else.
# ----------------------------------------------------------------------
# A big-button page for whoever is in the room: join, leave, mute, camera
# and volume. It is opened by scanning the code on the TV — no app to
# install and no PIN to remember.
CONTROLLER_ENABLED: true

# A small code in the bottom-right corner of the room screen. Point a
# phone camera at it to open the controller for this room.
CONTROLLER_QR_ON_TV: true

# Needed for the QR code to work when “Allow settings from other computers
# on the network” is off. Nothing is reachable without the code on the TV
# or the admin PIN.
CONTROLLER_LAN_ACCESS: false

# On, the QR code is this room's remote control: the room buttons,
# settings, backgrounds, restarts, logs — so a keyboard never has to be
# plugged into the Pi, not even for first-time setup. Off, a scanned phone
# gets the room buttons only and anything else asks for the admin PIN.
CONTROLLER_FULL_ACCESS: true

# Turn this on for a room in a public space, where being able to see the
# TV should not be enough to control it.
CONTROLLER_REQUIRE_PIN: false

# ----------------------------------------------------------------------
# Display & browser
#   Chromium kiosk behaviour on the TV.
# ----------------------------------------------------------------------
# Turn off only when developing on a normal computer.
KIOSK_ENABLED: true

# “auto” searches for chromium-browser, chromium then google-chrome.
CHROMIUM_BINARY: auto

# Used by the appliance to drive the browser. Never exposed off the Pi.
CHROMIUM_DEBUG_PORT: 9222

# “auto” looks at the machine and picks: a mini-PC or NUC gets “high” (GPU
# rasterisation and video decoding on, join timings unpadded), a Pi 4 or 5
# gets “balanced”, a Pi 3 gets “low”. Choose one by hand to override the
# guess. It only ever supplies defaults — anything you have set yourself
# still wins.
# options: auto, high, balanced, low
PERFORMANCE_PROFILE: auto

# Fix for a blank or white screen. “auto” detects Wayland (the default on
# Raspberry Pi OS Bookworm). Try “wayland”, then “x11”, then “software” —
# software always renders but without GPU acceleration.
# options: auto, wayland, x11, software
CHROMIUM_RENDER_MODE: auto

CHROMIUM_EXTRA_ARGS: ''

HIDE_CURSOR: true

# Off keeps the dashboard visible at all times.
SCREEN_BLANKING: false

# options: dark, light
THEME: dark

# Hex colour used for the JOIN button and highlights.
ACCENT_COLOR: '#3d8bfd'

SHOW_SHARING_INSTRUCTIONS: true

# The small camera / microphone / network dots along the bottom.
SHOW_STATUS_INDICATORS: true

# ----------------------------------------------------------------------
# Background & slideshow
#   The wallpaper behind the dashboard. Upload your own photos and
#   videos from the control panel and they rotate as a slideshow; a
#   video plays all the way through before the next slide.
# ----------------------------------------------------------------------
# “theme” is the built-in gradient. “slideshow” rotates through the images
# you upload in the control panel. “solid” is a single colour.
# options: theme, slideshow, solid
BACKGROUND_MODE: theme

# How long each slideshow image stays on screen before it fades to the
# next. Videos ignore this and play to the end.
BACKGROUND_SLIDESHOW_SECONDS: 45

# Off by default, and it should usually stay off: the wallpaper talking
# over a meeting is worse than a silent clip.
BACKGROUND_VIDEO_SOUND: false

# Off plays them in filename order.
BACKGROUND_SHUFFLE: true

# Keeps the time and meeting text readable over a bright photo. Raise it
# if the text is hard to read from across the room.
BACKGROUND_DIM_PERCENT: 55

# A little blur makes busy photos easier to read text over.
BACKGROUND_BLUR_PIXELS: 0

# Used when Background is set to “solid”.
BACKGROUND_SOLID_COLOR: '#0b1220'

# Turn off to freeze the slideshow contents.
BACKGROUND_ALLOW_UPLOADS: true

# ----------------------------------------------------------------------
# Reliability & recovery
#   Self-healing. Leave these alone unless you have a reason.
# ----------------------------------------------------------------------
HEALTH_CHECK_SECONDS: 15

# One per line.
NETWORK_CHECK_HOSTS:
- 1.1.1.1
- 8.8.8.8

# If Chromium stops responding or drifts to an unexpected page, put it
# back on the dashboard.
AUTO_RECOVER_BROWSER: true

# A tiny timer outside the app checks the appliance every minute and
# restarts anything that has stopped answering.
WATCHDOG_ENABLED: true

# If the appliance cannot be revived by restarting services, reboot the
# Pi. Rate-limited to once an hour.
WATCHDOG_REBOOT_ENABLED: true

# With a 1-minute watchdog, 10 means roughly ten minutes of being
# completely unresponsive.
WATCHDOG_REBOOT_AFTER_FAILURES: 10

# Pulls the latest version from the repository this room was installed
# from, before the dashboard starts. A room that cannot reach the
# repository, or whose files have been edited on the Pi, simply keeps the
# version it has — updating never stops the room starting.
AUTO_UPDATE_ON_BOOT: true

# Empty follows whichever branch the Pi is on. Only fast-forward updates
# are taken, so a branch that has diverged is left alone.
AUTO_UPDATE_BRANCH: ''

# Optional HH:MM (24-hour) at which the room software restarts itself
# while nobody is around, e.g. 04:30. Empty disables it.
DAILY_RESTART_TIME: ''

# ----------------------------------------------------------------------
# System & access
#   Ports, logging and administrative access.
# ----------------------------------------------------------------------
# Change this if another program already uses the port. The TV and the
# control-panel address both follow it.
DASHBOARD_PORT: 8080

# 127.0.0.1 keeps the dashboard on the Pi itself. Use the LAN admin switch
# below rather than editing this by hand.
DASHBOARD_HOST: 127.0.0.1

# Lets you open the Settings page from a laptop instead of plugging a
# keyboard into the Pi. Requires an admin PIN.
ADMIN_LAN_ACCESS: false

# Digits only. Required before network access to the Settings page can be
# switched on.
ADMIN_PIN: ''

# The simplified touch page at /panel used to join meetings, change the
# background and restart things from a phone.
PANEL_ENABLED: true

# Displays the http://…:8080/panel address in the corner of the dashboard
# so anyone can find it. Turn off once the room is set up.
PANEL_SHOW_URL_ON_TV: true

# DEBUG is noisy but useful while setting the room up.
# options: DEBUG, INFO, WARNING, ERROR
LOG_LEVEL: INFO

# “text” is easy to read in journalctl; “json” suits log collectors.
# options: text, json
LOG_FORMAT: text

# Runs with mock hardware so the dashboard can be built on a laptop. Never
# leave this on in a real room.
DEV_MODE: false
